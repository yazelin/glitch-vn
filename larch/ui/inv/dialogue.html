<!-- larch-skill-part: dialogue -->
<script type="application/larch-params">
{
  "mark": { "type": "color", "label": "別人講話的書籤", "default": "#8a3b2f" },
  "pen": { "type": "color", "label": "她自己講話的書籤", "default": "#3f6f8e" },
  "paper": { "type": "color", "label": "紙的顏色", "default": "#f1ece0" },
  "opacity": { "type": "range", "label": "紙的不透明度", "min": 80, "max": 100, "step": 2, "unit": "%", "default": 98 }
}
</script>
<style>
/* 守則本的一頁：左邊是皮面書背，紅色邊線，橫線對齊每一行字。
   講話的人是從頁頂探出來的書籤；她自己講話用藍色那張，別人用紅色那張，旁白不夾書籤。
   右下角翻起來的頁角就是「下一句」。 */
:root { --skin-mark: #8a3b2f; --skin-pen: #3f6f8e; --skin-paper: #f1ece0; --skin-opacity: 98%;
  --tab: var(--skin-mark); --spine: 14px; --margin: 34px; --pad-top: 16px; --lh: calc(var(--larch-text-size, 22px) * 1.9); }
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; overflow: hidden; }
body { padding: 30px 10px 6px; font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif; }
.dlg { position: relative; max-width: 1120px; margin: 0 auto; filter: drop-shadow(0 8px 16px rgba(0,0,0,.35)); }
.page { position: relative; min-height: 0; padding: var(--pad-top) clamp(48px, 4.5vw, 70px) 14px calc(var(--spine) + var(--margin) + 18px); color: #262a38;
  background-color: color-mix(in srgb, var(--skin-paper) var(--skin-opacity), transparent);
  background-image:
    linear-gradient(90deg, transparent calc(var(--spine) + var(--margin)), rgba(201,70,61,.5) calc(var(--spine) + var(--margin)), rgba(201,70,61,.5) calc(var(--spine) + var(--margin) + 1.5px), transparent calc(var(--spine) + var(--margin) + 1.5px)),
    repeating-linear-gradient(180deg, transparent 0, transparent calc(var(--lh) - 1px), rgba(84,96,124,.2) calc(var(--lh) - 1px), rgba(84,96,124,.2) var(--lh));
  background-position: 0 0, 0 var(--pad-top);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 26px), calc(100% - 26px) 100%, 0 100%); }
/* 皮面書背與縫線 */
.page::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--spine); background: linear-gradient(90deg, #241d1a, #3b302a 55%, #2a2320); }
.page::after { content: ""; position: absolute; left: calc(var(--spine) - 6px); top: 10px; bottom: 10px; border-left: 1.5px dashed rgba(214,192,150,.6); }

.tab { position: absolute; z-index: 2; top: -27px; left: calc(var(--spine) + var(--margin) + 14px); display: inline-flex; align-items: center; height: 28px; padding: 0 15px;
  border-radius: 7px 7px 0 0; background: var(--tab); color: #fbf6ea; font: 700 clamp(14px, 1.05vw, 17px)/1 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; letter-spacing: .14em;
  box-shadow: inset 0 -7px 7px -7px rgba(0,0,0,.45); }
html[data-self] { --tab: var(--skin-pen); }
html[data-narrator] .tab { display: none; }

.text { position: relative; min-height: calc(var(--lh) * 2); max-width: 40em; margin: 0; font-size: var(--larch-text-size, 22px); line-height: var(--lh); letter-spacing: .02em; white-space: pre-wrap; overflow-wrap: anywhere; }

/* 翻起來的頁角＝下一句 */
.next { position: absolute; right: 0; bottom: 0; width: 26px; height: 26px; padding: 0; border: 0; cursor: pointer;
  background: linear-gradient(135deg, #d4cab3 0%, #e9e2d1 49%, transparent 50%); filter: drop-shadow(-2px -2px 2px rgba(0,0,0,.16));
  transform-origin: 100% 100%; animation: lift 2s ease-in-out infinite; }
@keyframes lift { 0%, 100% { scale: 1; } 50% { scale: 1.14; } }
.next:hover, .next:focus-visible { animation: none; scale: 1.25; outline: none; background: linear-gradient(135deg, #c8b48c 0%, #efe2c0 49%, transparent 50%); }
.next:focus-visible { filter: drop-shadow(0 0 0 #262a38) drop-shadow(-2px -2px 0 var(--skin-mark)); }
.next:disabled { opacity: .35; animation: none; }

@media (max-width: 640px) {
  :root { --spine: 12px; --margin: 18px; }
  body { padding-top: 32px; }
  .page { padding: 20px 40px 18px calc(var(--spine) + var(--margin) + 12px); min-height: 130px; }
  .tab { left: calc(var(--spine) + var(--margin) + 8px); }
  .text { font-size: max(18px, var(--larch-text-size, 22px)); }
}
@media (prefers-reduced-motion: reduce) { .next { animation: none; } }
</style>
<div class="dlg">
  <div class="tab"><span data-larch-slot="speaker"></span></div>
  <section class="page" aria-label="對話">
    <p class="text" data-larch-slot="text"></p>
  </section>
  <button class="next" data-larch-action="advance" aria-label="下一句"></button>
</div>
<script>
// 書籤顏色：她自己（卡片上的講者「玩家」）用藍色那張；「旁白」與沒有講者時不夾書籤
const sp = document.querySelector('[data-larch-slot="speaker"]');
function sync() {
  const n = (sp.textContent || '').trim(), root = document.documentElement;
  root.toggleAttribute('data-narrator', !n || n === '旁白' || !root.hasAttribute('data-has-speaker'));
  root.toggleAttribute('data-self', n === '玩家');
}
new MutationObserver(sync).observe(sp, { childList: true, characterData: true, subtree: true });
new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ['data-has-speaker'] });
addEventListener('larch:state', sync);
sync();
</script>
