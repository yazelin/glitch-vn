<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>調查板</title>
<!--
  《格莉奇與黑洞先生・調查篇》調查板（Larch miniGame 卡）

  契約是從 Larch 線上 bundle 裡它自己產生的內建卡片樣板抄下來的，不是猜的：
    送出 {type:'larch:ready'}
    收到 {type:'larch:init', values, variables, assets, characters, locale}
    寫入 {type:'larch:set', name, value}     只有 miniGameWriteVars 清單裡的名字會被接受
    結束 {type:'larch:complete', result, payload}
  iframe 是 sandbox="allow-scripts"：沒有網路、沒有 localStorage、沒有 same-origin。
  所以這一份不引用任何外部資源，要留下的東西一律 larch:set 寫回變數。

  miniGameReadVars ：day slot met dest night_visits seen_booth visited met_<每個人> 以及 THREADS 用到的 open_*／names_seen／see_stairs
                     open_roof open_laundry open_figure open_parts
                     open_studio open_tower14
  miniGameWriteVars：day slot dest here night_visits met visited met_<每個人>

  **解鎖是一個地點一個布林，不是一串逗號清單。** 清單要「讀出來、加一個、寫回去」，
  而普通對話卡做不到那件事（它只能設一個值）。布林的話，管理員講完那句話的那張卡
  直接把 open_roof 設成 true 就好。誰在哪裡開哪一個，見 design/調查篇-變數.md。

  一次開板等於一個時段。玩家只選地點，時間自己往前走（深夜之後換日）。

  畫面（2026-09-07 重做）：這一頁是她出門前攤開的街區。一條車站前的大街橫過下面，
  舊公寓在左邊的巷子裡，經紀公司與 0x 那棟在右邊。每個地點是街上的一棟房子，
  有人在的窗戶亮著。時間只從天色看得出來：白天暖白、晚上藍底帶路燈、深夜紫黑。
  沒開的地方畫成她的字跡註記，灰的、虛線，寫的是她自己還缺什麼。
-->
<style>
:root{
  --board:#2a2320; --board2:#382e28; --edge:#1a1512;
  --text:#ece9f4; --dim:#a39a8f; --cyan:#7fd6e8; --pin:#c9463d; --pin2:#e0c35a;
  --paper:#f2efe6; --paper2:#e6e1d3; --ink:#2a2a33; --ink2:#5d5a66; --sticky:#f0d98a; --sticky2:#e2c96e;
  --sky-a:#2a2320; --sky-b:#2a2320;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--board);color:var(--text);
  font:15px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;overflow:hidden}
/* 軟木板：兩層顆粒加一條斜光 */
.sky{position:absolute;inset:0;
  background:
    radial-gradient(circle at 20% 30%,rgba(255,255,255,.035) 0 1px,transparent 2px) 0 0/7px 9px,
    radial-gradient(circle at 70% 60%,rgba(0,0,0,.18) 0 1px,transparent 2px) 3px 4px/11px 13px,
    linear-gradient(115deg,var(--board2) 0%,var(--board) 45%,var(--edge) 100%)}
.sky::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 120px rgba(0,0,0,.55)}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;padding:2.4vh 3vw 2vh}
header{flex:none;display:flex;align-items:baseline;gap:.9em;flex-wrap:wrap}
h1{margin:0;font:600 clamp(19px,3.2vw,28px)/1.1 "Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;letter-spacing:.04em}
.when{font:500 clamp(14px,2vw,17px)/1.2 "Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;color:var(--cyan);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.hint{color:var(--dim);font-size:clamp(11px,1.4vw,13px);margin-left:auto}
.map{position:relative;flex:1;margin-top:1vh;min-height:0}
.map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.map .st{stroke:rgba(255,255,255,.13);stroke-linecap:round;fill:none}
/* 她的便條：板子左上角一張大的，寫明天要做的事 */
.todo{position:absolute;left:1.5%;top:2%;transform:rotate(-1.5deg);width:13.5em;background:linear-gradient(180deg,#f2efe6,#e6e1d3);
  color:var(--ink);padding:.7em .8em .8em;border-radius:2px;box-shadow:0 6px 14px rgba(0,0,0,.45);z-index:1;pointer-events:none}
.todo::before{content:"";position:absolute;left:50%;top:-.5em;width:.95em;height:.95em;margin-left:-.48em;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#ff8a80,var(--pin) 55%,#7a1f18);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.todo b{display:block;font:600 clamp(12px,1.5vw,13.5px)/1.3 "Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;color:var(--ink2);margin-bottom:.3em}
.todo p{margin:0;font:italic clamp(12px,1.55vw,14px)/1.5 "Noto Serif TC","Songti TC","PMingLiU",Georgia,serif}
.map .thread{stroke:var(--pin);stroke-width:.35;fill:none;opacity:.85}
/* 釘上去的東西：拍立得或便條 */
button.spot{position:absolute;transform:translate(-50%,-50%) rotate(var(--rot,0deg));appearance:none;cursor:pointer;
  color:var(--ink);font:inherit;text-align:left;background:var(--paper);border:0;border-radius:2px;
  padding:.45em .5em .55em;width:8.6em;display:flex;flex-direction:column;gap:.3em;
  box-shadow:0 6px 14px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.35) inset;
  transition:transform .12s,box-shadow .2s}
button.spot::before{content:"";position:absolute;left:50%;top:-.5em;width:.95em;height:.95em;margin-left:-.48em;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#ff8a80,var(--pin) 55%,#7a1f18);box-shadow:0 2px 3px rgba(0,0,0,.5)}
button.spot .photo{width:100%;aspect-ratio:4/3;background:#111 center/cover no-repeat;border-radius:1px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
button.spot .photo.empty{background:linear-gradient(135deg,#d9d4c7,#c7c1b2);}
button.spot:hover,button.spot:focus-visible{outline:none;transform:translate(-50%,-52%) rotate(var(--rot,0deg)) scale(1.03);
  box-shadow:0 12px 22px rgba(0,0,0,.55)}
button.spot:active{transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(.99)}
button.spot[disabled]{cursor:default}
button.spot[disabled]:hover{transform:translate(-50%,-50%) rotate(var(--rot,0deg));box-shadow:0 6px 14px rgba(0,0,0,.45)}
.name{font:600 clamp(13px,1.7vw,15px)/1.2 "Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;letter-spacing:.02em}
.who{color:var(--ink2);font-size:clamp(11px,1.4vw,12.5px);line-height:1.35}
.who.unknown{color:var(--ink2)}
.who.hint{font:italic clamp(11px,1.35vw,12px)/1.4 "Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;color:var(--ink)}
/* 沒去過、沒開：便條紙，沒有照片 */
button.spot.note{background:linear-gradient(180deg,var(--sticky),var(--sticky2));width:8.2em;padding:.6em .6em .65em}
button.spot.note::before{background:radial-gradient(circle at 35% 35%,#fff3b0,var(--pin2) 55%,#8a7420)}
button.spot.locked{opacity:.92}
button.spot.locked .name{color:var(--ink2);font-weight:500}
button.spot.closed{opacity:.55}
footer{flex:none;display:flex;justify-content:flex-end;align-items:center;margin-top:.6vh}
button.skip{appearance:none;cursor:pointer;color:var(--dim);font:inherit;font-size:clamp(12px,1.5vw,14px);
  background:none;border:0;border-bottom:1px solid rgba(255,255,255,.25);padding:.25em .1em}
button.skip:hover,button.skip:focus-visible{color:var(--text);border-color:var(--cyan);outline:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* 直向手機：地圖式排版擠不下，改成兩欄便條牆，往下捲。街道線與紅線不畫，待辦便條排最上面 */
@media (orientation:portrait){
  .wrap{padding:2vh 3.5vw 1.5vh}
  .map{display:grid;grid-template-columns:1fr 1fr;gap:1.1em .8em;align-content:start;overflow-y:auto;padding:.9em .3em 1.2em}
  .map svg{display:none}
  .todo{position:static;transform:rotate(-.6deg);grid-column:1/-1;width:auto;margin:0 0 .2em}
  button.spot,button.spot.note{position:static;transform:rotate(var(--rot,0deg)) scale(.96);width:auto;min-height:5.2em}
  .name{font-size:14px}.who{font-size:11.5px}.who.hint{font-size:11.5px}
}
</style></head>
<body><div class="sky" id="sky"></div><div class="wrap">
  <header>
    <h1>今天要去哪<span style="font-size:.55em;opacity:.7;margin-left:.6em">南港</span></h1><span class="when" id="when"></span>
    <span class="hint" id="hint"></span>
  </header>
  <div class="map" id="grid">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path class="st" d="M0 74 H100" stroke-width="3"/>
      <path class="st" d="M32 74 V10" stroke-width="1.6"/>
      <path class="st" d="M66 74 V40" stroke-width="1.4"/>
      <path class="st" d="M84 74 V46" stroke-width="1.2"/>
      <path class="st" d="M0 92 H58" stroke-width="1.4"/>
      <g id="threads"></g>
    </svg>
  </div>
  <footer><button class="skip" id="skip">這一段不出門</button></footer>
</div>
<script>
var values={}, vars={}, done=false;
function setVar(n,v){ if(n) parent.postMessage({type:'larch:set',name:n,value:v},'*'); }
function finish(result,payload){ if(done)return; done=true;
  parent.postMessage({type:'larch:complete',result:result,payload:payload},'*'); }
function num(v,d){ var n=Number(v); return isNaN(v)||v===''||v==null?d:n; }
function list(v){ return String(v==null?'':v).split(/[,、]/).map(function(s){return s.trim();}).filter(Boolean); }

/*@@TODO@@*/
if(typeof todoLines!=='function'){ window.todoLines=function(){ return []; }; }
var SLOTS=['上午','下午','晚上','深夜'];
// 各地點的照片（日版、夜版），推送層注入；本檔獨立打開時是空的，拍立得會是灰的
var PHOTOS = /*@@PHOTOS@@*/{};
// 她把兩件事接起來的時候才拉線：[變數, 從, 到]
var THREADS=[
 ['open_roof','lobby','roof'],
 ['open_parts','roof','parts'],
 ['open_laundry','store','laundry'],
 ['open_figure','store','figure'],
 ['open_studio','laundry','studio'],
 ['open_tower14','street','tower14'],
 ['seen_booth','street','booth'],
 ['see_stairs','tower14','lobby'],
 ['names_seen','studio','roof'],['names_seen','studio','store'],['names_seen','studio','booth'],['names_seen','studio','tower14']
];
// 天色：時間只從這裡感覺得到（design/調查篇-場景.md「白天與夜晚是兩種色溫」）
var SKY=[['#3a2f27','#2a2320'],['#3d2d22','#2a2320'],['#221f2c','#2a2320'],['#1c1724','#2a2320']];

// 地點：代號、名字、每個時段的狀態、在街區上的位置（百分比）
//   '名字' = 那個人常駐　　''  = 開著可是沒有常駐　　null = 這個時間進不去
// **「沒有常駐」跟「沒開」是兩件事。** 一樓的晚上沒有常駐（管理員下班了），
// 可是那正是黑洞先生唯一會出現的時段，寫成 null 等於把全作最重要的一場關掉。
// 空手而回本來就是這款的一部分（見設計文件三之一），所以預設是開著。
var SPOTS=[
 {id:'lobby',   name:'一樓',        live:['管理員','管理員','',''], x:19, y:52},
 {id:'roof',    name:'頂樓收音機店', live:['諾亞','諾亞','諾亞',null], gate:'open_roof', x:19, y:22,
  hint:'有人說樓上那間什麼都留著。我需要一個壞掉的東西。'},
 {id:'street',  name:'車站前那條街', live:['路人','路人','路人',''], x:48, y:80},
 {id:'busstop', name:'車站前站牌',  live:['路人','路人','路人',''], x:22, y:87},
 {id:'metro',   name:'南港站二號出口', live:['路人','路人','路人',''], x:73, y:92},
 {id:'store',   name:'便利商店',    live:['店員','店員','店員','店員'], x:60, y:56},
 {id:'parts',   name:'材料行',      live:['老闆','老闆',null,null], gate:'open_parts', x:88, y:69,
  hint:'他等那顆管子等兩個禮拜了。他走不開。'},
 {id:'laundry', name:'自助洗衣店',  live:['','','',''], gate:'open_laundry', x:77, y:56,
  hint:'隔壁那家深夜也開。'},
 {id:'figure',  name:'手辦店',      live:[null,'店員','店員',null], gate:'open_figure', x:46, y:57,
  hint:'他說他都在那裡買。'},
 {id:'studio',  name:'斑比工作室',  live:[null,'斑比','斑比','斑比'], gate:'open_studio', x:46, y:26,
  hint:'畫她的人。名字我還沒問到。'},
 // **booth 永遠是灰的，而且提示永遠是那一句。** 玩家會一直看到它，一直進不去。
 // 那是刻意的挫折，而且它會讓「深夜在便利商店撞到鐵塔」變成整款最好的一個瞬間。
 // 在街上被鐵塔擋過（seen_booth）之後才畫在板上，而且永遠是灰的。
 {id:'booth',   name:'錄音間門口',  live:['鐵塔','鐵塔',null,null], x:76, y:20,
  hint:'經紀公司在哪裡我知道了。可是我進不去。', sealed:true, showIf:'seen_booth'},
 // tower14 在設計的解鎖表裡漏掉了（它列在「走不進去的」那一組，可是沒說什麼時候出現）。
 // 照既有規則補：提示講他缺什麼，不講該去問誰，而且只講他知道的。
 {id:'tower14', name:'十四樓大廳',  live:['櫃檯','櫃檯','保全','保全'], gate:'open_tower14', x:90, y:30,
  hint:'那個 AI 是哪一家公司的，我還沒查到。'},
];

// **trust 3 的那五個私人地方不在這張表上。**（貓草家、斑比工作室那面牆、
// 諾亞的鞋盒、管理員的失物箱、保全的監視器）
// 設計文件一之三寫得很清楚：「這五個是場景不是地點：在原本那個地點裡多開一段。」
// 做成板上的一格會讓玩家不請自來敲貓草家的門，而那正是這個角色不可能接受的事
// ——正典裡他要先講「你不要寫出去喔」才讓人進去。
// 它們是 scene 代號（catgrass_door、catgrass_home），不是 dest。

// 訪客：某個人剛好也在。[地點, 時段, 機率]
// 黑洞先生那一條是正典（第五章、調查篇第二天）：他只在一樓的晚上，七點多。
// 0.6 不是 1.0，因為每一次都遇到會把那一場的份量磨掉。
// 必要的相遇不擲骰：第一次（第二天起）、第二次（第五到七天）、第三次（第八到十一天）那幾個時間窗裡他一定在，
// 窗外才是三成五。斑比在洗衣店晚上一定在（她是通往工作室的唯一一條路）。
function holeProb(){ var d=num(values.day,1), h=num(values.hole_sightings,0);
  if((h===0&&d>=2)||(h===1&&d>=5&&d<=7)||(h===2&&d>=8&&d<=11)) return 1; return 0.35; }
var VISITS=[
 ['lobby',  2,'黑洞先生',holeProb],
 ['store',  3,'貓草',    1.00],
 ['store',  3,'鐵塔',    0.25],
 ['store',  2,'斑比',    0.20],
 ['figure', 1,'貓草',    0.40],
 ['figure', 2,'貓草',    0.40],
 ['laundry',3,'貓草',    0.20],
 ['laundry',2,'斑比',    1.00],
 ['parts',  1,'諾亞',    0.15]
];

function whoIsThere(spotId, slot){
  var out=[], s=null, i;
  for(i=0;i<SPOTS.length;i++) if(SPOTS[i].id===spotId) s=SPOTS[i];
  if(s && s.live[slot]) out.push(s.live[slot]);
  for(i=0;i<VISITS.length;i++){
    var v=VISITS[i];
    var pr=(typeof v[3]==='function')?v[3]():v[3];
    if(v[0]===spotId && v[1]===slot && Math.random()<pr && out.indexOf(v[2])<0) out.push(v[2]);
  }
  return out;
}

// 一次開板等於一個時段。深夜之後換日。
// **時間在回到板上的時候才推進**，出門時不動：不然那一趟的選單與規則讀到的是下一個時段
// （上午去一樓，選單寫下午；2026-09-07 抓到）。板一開、發現 dest 還留著上一趟的目的地，就推進並清掉。
// 深夜要到第四天才亮（信心.md 三）：前三天晚上過完直接換日，他還在睡覺。遊戲一句都不解釋。
function advance(){
  var slot=num(values.slot,0), day=num(values.day,1);
  if(slot>=3 || (slot===2 && day<4)){ values.slot=0; values.day=day+1; setVar('slot',0); setVar('day',day+1); }
  else { values.slot=slot+1; setVar('slot',slot+1); }
}
function metKey(p){ return 'met_'+(p==='老闆'?'材料行老闆':p); }
function go(spotId){
  var slot=num(values.slot,0), day=num(values.day,1);
  var here=whoIsThere(spotId,slot);
  setVar('here', here.join(','));
  // 碰過幾次：設計說「met_<誰> 由那一趟自己加」，加的地方就是這裡（2026-09-07）。
  // 老闆在規則裡叫材料行老闆；路人與黑洞先生不算（他的次數是 hole_sightings，故事卡寫）。
  var met=list(values.met);
  here.forEach(function(p){
    if(p==='路人'||p==='黑洞先生') return;
    var v=metKey(p);
    setVar(v, num(values[v],0)+1);
    if(met.indexOf(p)<0) met.push(p);
  });
  setVar('met', met.join(','));
  var visited=list(values.visited); if(visited.indexOf(spotId)<0) visited.push(spotId); setVar('visited', visited.join(','));
  // 上午／下午走日版入口，晚上走 @e，深夜走 @n（三種色溫，design/調查篇-場景.md）。
  // 板上其他地方只認前面的地點代號；@n 只給入口那條邊看。
  setVar('dest', slot===3 ? spotId+'@n' : slot===2 ? spotId+'@e' : spotId);
  // 收尾門檻之一：深夜至少出門三次（信心.md 五）。只算真的出門，不算「這一段不出門」。
  if(slot===3) setVar('night_visits', num(values.night_visits,0)+1);
  finish(spotId,{day:day,slot:slot,here:here});
}

function start(){
  if(values.dest){ advance(); setVar('dest',''); setVar('here',''); }
  var slot=num(values.slot,0), day=num(values.day,1);
  var met=list(values.met);
  // gate 沒填的就是一開始就有的（一樓、車站前那條街、公車站、捷運出口、便利商店）。
  function isOpen(s){ return s.sealed ? false : (!s.gate || values[s.gate]===true || values[s.gate]==='true'); }
  function known(p){ return met.indexOf(p)>=0 || num(values[metKey(p)],0)>0; }

  document.getElementById('when').textContent='第 '+day+' 天 ・ '+SLOTS[slot];
  document.getElementById('hint').textContent='去一個地方就過一個時段';
  var sky=document.getElementById('sky');
  sky.style.setProperty('--sky-a', SKY[slot][0]); sky.style.setProperty('--sky-b', SKY[slot][1]);
  var map=document.getElementById('grid');
  map.className='map';
  Array.prototype.slice.call(map.querySelectorAll('button.spot, .todo')).forEach(function(b){ b.remove(); });

  var visited=list(values.visited);
  var lines=document.getElementById('threads'); lines.textContent='';
  function spotAt(id){ for(var i=0;i<SPOTS.length;i++) if(SPOTS[i].id===id) return SPOTS[i]; return null; }
  THREADS.forEach(function(t){
    if(!(values[t[0]]===true||values[t[0]]==='true')) return;
    var a=spotAt(t[1]), b=spotAt(t[2]); if(!a||!b) return;
    var p=document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('class','thread');
    var mx=(a.x+b.x)/2, my=(a.y+b.y)/2-3;
    p.setAttribute('d','M'+a.x+' '+a.y+' Q'+mx+' '+my+' '+b.x+' '+b.y); lines.appendChild(p);
  });

  // 她自己寫在便條上的判斷，照狀態換（拉力不足的地方在這裡補）
  function noteFor(s){
    var d=num(values.day,1), h=num(values.hole_sightings,0);
    if(s.id==='lobby' && slot===2 && h>=1) return '七點多。他會在。';
    if(s.id==='street' && d>=3 && slot<=1 && !(values.seen_booth===true||values.seen_booth==='true')) return '經紀公司在車站那一邊。走過去看看。';
    if(s.id==='store' && slot===3 && num(values.night_visits,0)===0) return '深夜還開著。';
    return null;
  }
  var todo=document.createElement('div'); todo.className='todo';
  var tb=document.createElement('b'); tb.textContent='明天'; todo.appendChild(tb);
  todoLines(values).forEach(function(t){ var p=document.createElement('p'); p.textContent=t; todo.appendChild(p); });
  map.appendChild(todo);
  SPOTS.forEach(function(s,i){
    var open = isOpen(s);
    // 沒開又沒有提示的（trust 3 那幾個私人地方）根本不畫。
    if(!open && !s.hint) return;
    if(s.showIf && !(values[s.showIf]===true || values[s.showIf]==='true')) return;
    var live=s.live[slot];
    var been = visited.indexOf(s.id)>=0 || s.id==='lobby';   // 開場那一趟就在一樓，不經過板
    var b=document.createElement('button');
    b.className='spot'; b.type='button';
    b.style.left=s.x+'%'; b.style.top=s.y+'%';
    b.style.setProperty('--rot', ((i*7)%9-4)*0.8+'deg');
    var n=document.createElement('span'); n.className='name'; n.textContent=s.name;
    var w=document.createElement('span'); w.className='who';
    if(been && PHOTOS[s.id]){
      var ph=document.createElement('span'); ph.className='photo';
      var url=PHOTOS[s.id][slot===3?'night':slot===2?'evening':'day']||PHOTOS[s.id].day||PHOTOS[s.id].night;
      if(url) ph.style.backgroundImage='url("'+url+'")'; else ph.className='photo empty';
      b.appendChild(ph);
    } else { b.className+=' note'; }
    if(!open){
      // 看得到，可是灰的。提示是她自己的判斷，不是系統指令。
      b.className+=' locked'; b.disabled=true;
      w.className='who hint'; w.textContent=s.hint;
    }
    else if(live===null||live===undefined){ w.textContent='這個時間沒開'; w.className='who unknown'; b.disabled=true; b.className+=' closed'; }
    else if(live===''){ w.textContent='開著，可能沒人'; w.className='who unknown'; }
    else if(known(live)){ w.textContent=live; }
    else { w.textContent=been?'有人在':'沒去過'; w.className='who unknown'; }   // 去過可是那個人還沒認識
    var note=(!b.disabled)?noteFor(s):null;
    if(note){ w.className='who hint'; w.textContent=note; }
    b.appendChild(n); b.appendChild(w);
    if(!b.disabled) b.addEventListener('click',function(){ go(s.id); });
    map.appendChild(b);
  });

  document.getElementById('skip').addEventListener('click',function(){
    advance();
    setVar('dest',''); setVar('here','');
    finish('rest',{day:day,slot:slot});
  });
}

parent.postMessage({type:'larch:ready'},'*');
window.addEventListener('message',function(e){
  var d=e.data; if(!d||d.type!=='larch:init')return;
  values=d.values||{}; vars=d.variables||{};
  // 授權可讀的那份（variables）優先，values 是後備。
  for(var k in vars) values[k]=vars[k];
  try{ start(); }catch(err){ finish('error',{message:String(err)}); }
});
</script></body></html>
