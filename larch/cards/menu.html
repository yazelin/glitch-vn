<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>選單</title>
<!--
  《格莉奇與黑洞先生・調查篇》地點選單（Larch miniGame 卡）

  契約同 board.html。這一張是「到了一個地點之後，這一個時段可以問什麼」。
  複合判斷（地點 × 時段 × 誰在 × 變數）全部住在這裡，Larch 那邊只認一個變數：
  選了哪一段就 larch:set pick=<段落代號>，出邊照 pick 路由（larch/inv/build.py）。

  RULES 由推送層（larch/inv/push.py）在推上去之前注入，每一個地點一份，
  所以同一份 HTML 在十二個地點各自不同。本檔獨立打開時 RULES 是空的。

  miniGameReadVars ：day slot here 以及 RULES 裡出現的每一個變數（推送層算）
  miniGameWriteVars：pick

  畫面（2026-09-07 重做）：她的守則本攤開在場景上，右頁是這一趟能做的事，一行一件，
  她的口氣。左邊是皮面的書脊。場景在書後面透出來。
-->
<style>
:root{
  --leather:#2a2320; --leather2:#3b302a; --page:#e6e2d8; --page2:#ddd8cc; --rule:#c9c3b4;
  --ink:#24293a; --ink2:#5a6072; --mark:#8a3b2f; --cyan:#3f8ea0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;color:var(--ink);
  font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
body.ready{background:rgba(8,9,16,.42)}
.stage{height:100%;display:flex;align-items:center;justify-content:center;padding:3vh 3vw}
.book{position:relative;width:min(720px,94vw);height:min(88vh,640px);display:flex;
  box-shadow:0 18px 40px rgba(0,0,0,.45);border-radius:4px 10px 10px 4px;overflow:hidden}
.spine{flex:none;width:26px;background:linear-gradient(90deg,var(--leather) 0%,var(--leather2) 60%,var(--leather) 100%)}
.page{flex:1;min-width:0;display:flex;flex-direction:column;padding:3.2vh 5% 2.4vh 6%;
  background:
    repeating-linear-gradient(180deg,transparent 0 2.05em,var(--rule) 2.05em calc(2.05em + 1px)),
    linear-gradient(90deg,var(--page2) 0,var(--page) 6%,var(--page) 100%)}
header{flex:none;display:flex;align-items:baseline;gap:.9em;flex-wrap:wrap;padding-bottom:.3em}
h1{margin:0;font:600 clamp(18px,2.6vw,24px)/1.2 "Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;letter-spacing:.04em}
.when{font:500 clamp(13px,1.8vw,15px)/1.2 "Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;color:var(--cyan);letter-spacing:.06em}
.who{color:var(--ink2);font-size:clamp(12px,1.6vw,13.5px);margin-left:auto}
.list{flex:1;overflow-y:auto;padding-right:.4em;min-height:0}
button.seg{appearance:none;display:block;width:100%;text-align:left;cursor:pointer;color:inherit;
  font:inherit;background:none;border:0;padding:.3em 0 .3em 1.4em;position:relative;
  line-height:2.05em;height:2.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.seg::before{content:"";position:absolute;left:.15em;top:calc(1.02em - 1px);width:.75em;height:2px;
  background:var(--ink2);transform:rotate(-8deg)}
button.seg:hover,button.seg:focus-visible{outline:none;color:var(--mark)}
button.seg:hover::before,button.seg:focus-visible::before{background:var(--mark)}
.label{font:500 clamp(15px,1.9vw,17px)/1 "Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;letter-spacing:.02em}
.sub{color:var(--ink2);font-size:clamp(11px,1.4vw,12.5px);margin-left:.7em}
.empty{color:var(--ink2);font:italic clamp(14px,1.8vw,16px)/2.05em "Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;margin:0;padding-left:1.4em}
footer{flex:none;display:flex;justify-content:flex-end;padding-top:.4em}
button.skip{appearance:none;cursor:pointer;color:var(--ink2);font:inherit;
  font-size:clamp(12px,1.6vw,14px);background:none;border:0;border-bottom:1px solid var(--rule);padding:.2em .1em}
button.skip:hover,button.skip:focus-visible{color:var(--mark);border-color:var(--mark);outline:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><div class="stage"><div class="book"><div class="spine"></div><div class="page">
  <header><h1 id="loc"></h1><span class="when" id="when"></span><span class="who" id="who"></span></header>
  <div class="list" id="list"></div>
  <footer><button class="skip" id="skip" type="button">先走</button></footer>
</div></div></div>
<script>
var LOC = "@@LOC@@";
var LOC_NAME = "@@LOC_NAME@@";
var RULES = /*@@RULES@@*/[];
var SLOTS = ['上午','下午','晚上','深夜'];
var values = {}, done = false;

function setVar(n,v){ if(n) parent.postMessage({type:'larch:set',name:n,value:v},'*'); }
function finish(result,payload){ if(done)return; done=true;
  parent.postMessage({type:'larch:complete',result:result,payload:payload},'*'); }
function num(v,d){ var n=Number(v); return isFinite(n)&&v!==''&&v!=null?n:d; }
function list(v){ return String(v==null?'':v).split(/[,、]/).map(function(s){return s.trim();}).filter(Boolean); }
function el(t,cls,txt){ var e=document.createElement(t); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }

// 跟播放器同一套：布林字串當布林、數字字串當數字，其餘按字串比。
function norm(v){
  if(v==='true')return true; if(v==='false')return false;
  if(typeof v==='string' && v.trim()!=='' && isFinite(Number(v))) return Number(v);
  return v==null?'':v;
}
function hasItem(inv, id){
  var arr=[]; try{ arr=JSON.parse(inv||'[]'); }catch(e){ arr=[]; }
  if(!Array.isArray(arr)) return false;
  for(var i=0;i<arr.length;i++){ var it=arr[i]||{}; var k=String(it.id||it.n||'').trim().toLowerCase();
    var q=(it.q===undefined)?1:Number(it.q); if(k===String(id).toLowerCase() && q>0) return true; }
  return false;
}
function cmp(a,op,b){
  if(op==='hasItem') return hasItem(a,b);
  if(op==='lacksItem') return !hasItem(a,b);
  a=norm(a); b=norm(b);
  switch(op){
    case 'gt': return a>b; case 'gte': return a>=b; case 'lt': return a<b; case 'lte': return a<=b;
    case 'neq': return a!==b; default: return a===b;
  }
}
function passes(r, slot, here){
  if(r.slots && r.slots.length && r.slots.indexOf(slot)<0) return false;
  var i;
  for(i=0;i<(r.conds||[]).length;i++){
    var c=r.conds[i];
    if(c.any){ var j, okAny=false; for(j=0;j<c.any.length;j++) if(cmp(values[c.any[j].variable], c.any[j].op, c.any[j].value)) okAny=true; if(!okAny) return false; continue; }
    if(!cmp(values[c.variable], c.op, c.value)) return false;
  }
  if(r.who && r.who.length){
    var hit=false;
    for(i=0;i<r.who.length;i++) if(here.indexOf(r.who[i])>=0) hit=true;
    if(!hit) return false;
  }
  return true;
}

function start(){
  document.body.className='ready';
  var slot=num(values.slot,0), day=num(values.day,1);
  var here=list(values.here);
  document.getElementById('loc').textContent=LOC_NAME||LOC;
  document.getElementById('when').textContent='第 '+day+' 天 ・ '+SLOTS[slot];
  var DISPLAY=/*@@DISPLAY@@*/{};
  document.getElementById('who').textContent=here.length?here.map(function(n){ return DISPLAY[n]||n; }).join('、')+' 在':'這裡沒有人';
  var box=document.getElementById('list'); box.textContent='';
  var ok=RULES.filter(function(r){ return passes(r, slot, here); });
  if(!ok.length){
    box.appendChild(el('p','empty','這個時間這裡問不到什麼。'));
  }
  ok.forEach(function(r){
    var b=el('button','seg'); b.type='button';
    b.appendChild(el('span','label',r.label||r.seg));
    if(r.who && r.who.length) b.appendChild(el('span','sub',r.who.join('、')));
    b.addEventListener('click',function(){ setVar('pick', r.seg); finish(r.seg,{seg:r.seg}); });
    box.appendChild(b);
  });
  document.getElementById('skip').addEventListener('click',function(){
    setVar('pick',''); finish('leave',{});
  });
}

parent.postMessage({type:'larch:ready'},'*');
window.addEventListener('message',function(e){
  var d=e.data; if(!d||d.type!=='larch:init')return;
  values=d.values||{}; var vars=d.variables||{};
  for(var k in vars) values[k]=vars[k];
  try{ start(); }catch(err){ finish('error',{message:String(err)}); }
});
</script></body></html>
