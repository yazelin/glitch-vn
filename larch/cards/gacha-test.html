<!doctype html><meta charset=utf-8>
<!--
測試卡：格莉奇遊樂園．扭蛋機

**這張卡是橋接層，不是遊戲本體。** 遊戲本體在另一個 repo（glitch-park-gacha），
獨立部署在 GitHub Pages。這張卡只做一件事：翻譯兩套 postMessage 協定。

  Larch host  ⟷  這張卡（miniGameHtml，跑在 srcdoc+sandbox="allow-scripts" 裡）
                    送 larch:ready，收 larch:init{values,variables,...}
                    要存檔就送 larch:set{name,value}
                    結束就送 larch:complete

  這張卡  ⟷  內嵌的 iframe（遊戲本體，另一層 sandbox，opaque origin）
                    遊戲送 gacha:ready，這張卡回 gacha:state{state}
                    遊戲送 gacha:save{state}，這張卡轉成 larch:set 寫回 host
                    遊戲送 gacha:exit，這張卡送 larch:complete 結束這張卡
                    遊戲送 glitch-park:music，這張卡播放／靜音共用遊樂園主題曲

存檔用單一個變數 gacha_state（JSON 字串），不拆成好幾個變數——扭蛋機的存檔
只有 owned／plays 兩個欄位，拆開沒有意義，合併寫讀比較不會漏欄位。

2026-09-15 已先在獨立測試專案走通存檔與離開，再接進調查篇地圖。
-->
<style>
  html,body{margin:0;height:100%;background:#15131a}
  iframe{width:100%;height:100%;border:0;display:block}
  /* 狀態列保留在 DOM 供自動測試讀取，但正式畫面不顯示。 */
  #dbg{position:fixed;left:4px;top:4px;z-index:9;font:11px monospace;color:#8de8e0;
    background:rgba(0,0,0,.55);padding:3px 6px;border-radius:4px;max-width:90vw;
    white-space:pre-wrap;pointer-events:none;display:none}
</style>
<div id="dbg">等待 larch:init…</div>
<iframe id="game" src="https://yazelin.github.io/glitch-park-gacha/"></iframe>
<script>
var dbg = document.getElementById('dbg');
var game = document.getElementById('game');
var GAME_ORIGIN = '*';   // 遊戲是 opaque origin，收發都只能用 '*'
var state = null;        // 從 larch:init 拿到的 gacha_state（字串）解析後的物件
var parkMusic = null;    // 背景音樂由 Larch 外層卡片持有，不在內層遊戲重複播放
var parkMusicUrl = '';
var log = [];
function say(s) { log.push(s); if (log.length > 6) log.shift(); dbg.textContent = log.join('\n'); }

function controlParkMusic(d) {
  if (d.url && (!parkMusic || parkMusicUrl !== d.url)) {
    if (parkMusic) { parkMusic.pause(); parkMusic.removeAttribute('src'); }
    parkMusicUrl = d.url;
    parkMusic = new Audio(d.url);
    parkMusic.loop = true;
    parkMusic.preload = 'metadata';
    parkMusic.volume = .27;
  }
  if (!parkMusic) return;
  if (d.action === 'mute') {
    parkMusic.muted = !!d.muted;
    if (d.muted) parkMusic.pause();
  }
  if (d.action === 'play' && !d.muted) {
    parkMusic.muted = false;
    parkMusic.play().catch(function () {});
  }
  say('遊樂園音樂：' + (parkMusic.muted ? '關' : '開'));
}

say('送出 larch:ready');
parent.postMessage({ type: 'larch:ready' }, '*');

window.addEventListener('message', function (e) {
  var d = e.data;
  if (!d || !d.type) return;

  // ── 跟 Larch host 的那一半 ──
  if (d.type === 'larch:init') {
    var raw = d.variables && d.variables.gacha_state;
    try { state = raw ? JSON.parse(raw) : null; } catch (err) { state = null; }
    say('收到 larch:init，gacha_state=' + (raw || '(空)'));
    return;
  }

  // ── 跟內嵌遊戲的那一半（只認自己那個 iframe 送出來的） ──
  if (e.source !== game.contentWindow) return;

  if (d.type === 'glitch-park:music') {
    controlParkMusic(d);
  } else if (d.type === 'gacha:ready') {
    say('遊戲送 gacha:ready，回 gacha:state');
    game.contentWindow.postMessage({ type: 'gacha:state', state: state }, GAME_ORIGIN);
  } else if (d.type === 'gacha:save') {
    state = d.state;
    var s = JSON.stringify(state);
    say('遊戲送 gacha:save → 轉成 larch:set gacha_state=' + s);
    parent.postMessage({ type: 'larch:set', name: 'gacha_state', value: s }, '*');
  } else if (d.type === 'gacha:exit') {
    if (parkMusic) parkMusic.pause();
    say('遊戲送 gacha:exit → larch:complete');
    parent.postMessage({ type: 'larch:complete', result: 'exit', payload: {} }, '*');
  }
});
</script>
