<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#303943"/><text x="800" y="52" text-anchor="middle" fill="white" font-size="34">十四樓接待櫃台・俯視平面圖（不是正面構圖）</text>
  <rect x="130" y="85" width="1340" height="235" rx="20" fill="#82909e" stroke="#d7e0e8" stroke-width="8"/><text x="800" y="125" text-anchor="middle" fill="white" font-size="30">公司內側後牆／辦公入口／企業標誌（畫面背景）</text>
  <circle cx="800" cy="225" r="55" fill="#eee2d2"/><path d="M800 275 L800 330" stroke="white" stroke-width="12"/><text x="880" y="235" fill="white" font-size="28">櫃台人員面向玩家 ↓</text>
  <rect x="230" y="330" width="1140" height="150" rx="15" fill="#ebe7e1" stroke="#7c8793" stroke-width="10"/><text x="800" y="420" text-anchor="middle" fill="#26303b" font-size="36">高大理石接待櫃台</text>
  <rect x="130" y="500" width="1340" height="230" rx="20" fill="#aab7c5" stroke="#dce6ef" stroke-width="8"/><circle cx="800" cy="590" r="48" fill="#d8c7ba"/><path d="M800 545 L800 490" stroke="white" stroke-width="12"/><text x="875" y="600" fill="white" font-size="28">女主角／玩家，背對電梯與入口 ↑</text>
  <path d="M800 790 L800 685" stroke="#ffeb8a" stroke-width="18"/><text x="830" y="765" fill="#ffeb8a" font-size="30">鏡頭從電梯方向朝公司內側拍 ↑</text>
  <rect x="470" y="805" width="660" height="70" rx="12" fill="#425d76" stroke="#a9d8ff" stroke-width="8"/><text x="800" y="852" text-anchor="middle" fill="white" font-size="30">電梯／十四樓入口（只能在玩家背後）</text>
