  <path d="M800 790 L800 685" stroke="#ffeb8a" stroke-width="18"/><text x="830" y="765" fill="#ffeb8a" font-size="30">鏡頭朝店內拍 ↑</text>
  <rect x="520" y="805" width="560" height="70" rx="12" fill="#376d50" stroke="#9dffc4" stroke-width="8"/><text x="800" y="852" text-anchor="middle" fill="white" font-size="30">便利商店大門／出口（只能在玩家背後）</text>
