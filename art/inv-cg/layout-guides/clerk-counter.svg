<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#17202b"/><text x="800" y="52" text-anchor="middle" fill="white" font-size="34">便利商店・俯視平面圖（不是正面構圖）</text>
  <rect x="130" y="85" width="1340" height="235" rx="20" fill="#314d63" stroke="#8fc8e8" stroke-width="8"/><text x="800" y="125" text-anchor="middle" fill="white" font-size="30">店內後牆／冷藏櫃／員工工作區（畫面背景只能看見這一側）</text>
  <circle cx="800" cy="225" r="55" fill="#f1b66f"/><path d="M800 275 L800 330" stroke="white" stroke-width="12"/><text x="880" y="235" fill="white" font-size="28">店員面向玩家 ↓</text>
  <rect x="230" y="330" width="1140" height="150" rx="15" fill="#90644e" stroke="#f6d5a8" stroke-width="10"/><text x="800" y="420" text-anchor="middle" fill="white" font-size="36">收銀櫃台／完整實體隔板</text>
