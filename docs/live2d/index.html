<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>格莉奇 Live2D · 管線測試</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<style>
  :root{ --bg:#0e0f14; --fg:#e8e9ef; --dim:#8b8fa3; --ok:#5fd3a6; --bad:#ff7a8a; --line:#242737; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.6 system-ui,"Noto Sans TC",sans-serif;
       display:flex;flex-direction:column;min-height:100dvh}
  header{padding:14px 18px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.02em}
  header p{margin:2px 0 0;color:var(--dim);font-size:12px}
  main{flex:1;display:flex;min-height:0;flex-wrap:wrap}
  #stage{flex:1 1 420px;min-height:60dvh;position:relative;
         background:
           linear-gradient(45deg,#161824 25%,transparent 25%,transparent 75%,#161824 75%) 0 0/24px 24px,
           linear-gradient(45deg,#161824 25%,transparent 25%,transparent 75%,#161824 75%) 12px 12px/24px 24px,
           #1b1d2a}
  canvas{display:block;width:100%;height:100%}
  aside{flex:0 0 320px;max-width:100%;border-left:1px solid var(--line);
        padding:14px 16px;overflow:auto}
  aside h2{margin:0 0 8px;font-size:12px;color:var(--dim);font-weight:600;
           text-transform:uppercase;letter-spacing:.08em}
  #log{margin:0 0 18px;font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;
       white-space:pre-wrap;word-break:break-all}
  #log b{font-weight:600}
  .ok{color:var(--ok)} .bad{color:var(--bad)} .dim{color:var(--dim)}
  label{display:block;margin:10px 0 2px;font-size:12px;color:var(--dim)}
  input[type=range]{width:100%}
  .val{float:right;color:var(--fg);font:11px ui-monospace,monospace}
  @media(max-width:720px){ aside{flex:1 1 100%;border-left:0;border-top:1px solid var(--line)} }
</style>
</head>
<body>
<header>
  <h1>格莉奇 Live2D · 管線測試</h1>
  <p>一張拍平的 PNG → 34 層 → PSD → Cubism on Wine → .moc3 → 這一頁。全程 Ubuntu。</p>
</header>
<main>
  <div id="stage"></div>
  <aside>
    <h2>載入狀態</h2>
    <div id="log"></div>
    <div id="params" hidden>
      <h2>參數</h2>
      <div id="sliders"></div>
    </div>
  </aside>
</main>

<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
<script>
// 模型跟這一頁放在一起，GitHub Pages 直接服務。外部要用的話 jsDelivr 也吃同一個路徑：
// https://cdn.jsdelivr.net/gh/yazelin/glitch-vn@<sha>/docs/live2d/model/glitch.model3.json
const MODEL = './model/glitch.model3.json';

const logEl = document.getElementById('log');
const say = (msg, cls='') => {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = msg;
  logEl.appendChild(d);
  console.log('[demo]', msg);
};

// 給自動化驗收用：頁面自己記結果，Playwright 讀這個就好，不必判讀畫面
window.__demo = { status: 'loading', errors: [] };
const fail = (msg) => { window.__demo.status = 'error'; window.__demo.errors.push(msg); say('✗ ' + msg, 'bad'); };

(async () => {
  say('Cubism Core ' + (window.Live2DCubismCore ? '已載入' : '缺席'),
      window.Live2DCubismCore ? 'ok' : 'bad');
  if (!window.Live2DCubismCore) return fail('Live2DCubismCore 沒載到');
  if (!window.PIXI || !PIXI.live2d) return fail('pixi-live2d-display 沒載到');

  const app = new PIXI.Application({
    view: Object.assign(document.createElement('canvas'), {}),
    resizeTo: document.getElementById('stage'),
    backgroundAlpha: 0, antialias: true,
  });
  document.getElementById('stage').appendChild(app.view);

  let model;
  try {
    say('抓 model3.json …', 'dim');
    model = await PIXI.live2d.Live2DModel.from(MODEL, { autoInteract: false });
  } catch (e) {
    return fail('模型載入失敗：' + (e && e.message || e));
  }

  app.stage.addChild(model);
  const fit = () => {
    const s = Math.min(app.renderer.width / model.width, app.renderer.height / model.height) * 0.92;
    model.scale.set(s);
    model.position.set(app.renderer.width / 2, app.renderer.height / 2);
    model.anchor.set(0.5, 0.5);
  };
  fit(); window.addEventListener('resize', () => setTimeout(fit, 50));

  const core = model.internalModel.coreModel;
  // 參數 id：pixi-live2d-display 沒有公開的列舉方法，_parameterIds 是實際存在的那個
  const ids = core._parameterIds ?? [];
  const nParam = core.getParameterCount ? core.getParameterCount() : ids.length;
  const nDraw  = core.getDrawableCount ? core.getDrawableCount() : null;

  say('✓ 模型載入成功', 'ok');
  say(`參數 ${nParam} 個 · 網格 ${nDraw} 個（＝分層數）`, 'dim');
  say('這一版只有參數宣告、還沒綁變形，所以拉滑桿不會有反應；眼皮與五個嘴形跟眼睛嘴巴同時顯示，所以她是閉眼張嘴的。', 'dim');
  window.__demo = { status: 'ok', errors: [], params: nParam, drawables: nDraw,
                    size: [Math.round(model.width), Math.round(model.height)] };

  const box = document.getElementById('sliders');
  const want = ['ParamAngleX', 'ParamAngleY', 'ParamBodyAngleZ', 'ParamEyeLOpen', 'ParamMouthOpenY'];
  want.filter(id => ids.includes(id)).forEach(id => {
    const i = ids.indexOf(id);
    const lo = core._parameterMinimumValues?.[i] ?? -30;
    const hi = core._parameterMaximumValues?.[i] ?? 30;
    const lab = document.createElement('label');
    lab.innerHTML = `${id}<span class="val">0</span>`;
    const r = document.createElement('input');
    Object.assign(r, { type: 'range', min: lo, max: hi, step: (hi - lo) / 100, value: 0 });
    r.oninput = () => {
      lab.querySelector('.val').textContent = (+r.value).toFixed(1);
      try { core.setParameterValueById(id, +r.value); } catch (_) {}
    };
    box.append(lab, r);
  });
  document.getElementById('params').hidden = false;
})().catch(e => fail('未預期的錯誤：' + (e && e.message || e)));
</script>
</body>
</html>
